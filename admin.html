<!DOCTYPE html>
<html lang="id" data-theme="light" data-fs="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - Majelis Taklim Nur Annisa</title>
  <meta name="theme-color" content="#0E5A38">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-fs', localStorage.getItem('fs') || '1');
    })();
  </script>
</head>
<body class="admin">
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html" aria-label="Kembali ke website">
        <img src="assets/logo.jpg" alt="Logo" width="48" height="48">
        <span class="brand-text">Halaman Admin<small>Majelis Taklim Nur Annisa</small></span>
      </a>
      <div class="header-tools">
        <button class="tool-btn" id="btnTheme" type="button"></button>
        <button class="tool-btn" id="btnFont" type="button"></button>
        <button class="tool-btn" id="btnLogout" type="button" hidden>Keluar</button>
      </div>
    </div>
  </header>

  <!-- Login -->
  <main class="container" id="loginView">
    <div class="card login-card">
      <h1>Masuk Admin</h1>
      <p class="muted">Halaman ini khusus pengurus majelis taklim.</p>
      <form class="form" id="loginForm">
        <div>
          <label for="pw">Password</label>
          <input id="pw" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-lg btn-block" type="submit" id="btnLogin">Masuk</button>
        <div id="loginMsg" role="status" aria-live="polite"></div>
      </form>
      <p><a href="index.html">← Kembali ke website</a></p>
    </div>
  </main>

  <!-- Dasbor -->
  <main class="container" id="dashView" hidden>
    <div class="tabs" id="adminTabs" role="tablist" aria-label="Menu admin"></div>
    <div id="adminMsg" role="status" aria-live="polite"></div>
    <section id="adminContent"></section>
  </main>

  <!-- Formulir tambah/ubah -->
  <dialog class="modal" id="formDlg">
    <form method="dialog" class="form" id="dlgForm">
      <h2 id="dlgTitle"></h2>
      <div id="dlgFields" class="form"></div>
      <div id="dlgMsg" role="status" aria-live="polite"></div>
      <div class="card-actions">
        <button class="btn" type="submit" id="dlgSave">Simpan</button>
        <button class="btn btn-outline" type="button" id="dlgCancel">Batal</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
